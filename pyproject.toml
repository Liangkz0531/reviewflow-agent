[project]
name = "reviewflow-agent"
version = "0.1.0"
description = "A lightweight multi-agent code review workflow with Streamlit."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.60.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["samples", ".uv-cache", ".uv-python", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true


